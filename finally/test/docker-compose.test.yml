services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      LLM_MOCK: "true"
    tmpfs:
      - /app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-jammy
    working_dir: /app/test
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
      LLM_MOCK: "true"
      CI: "1"
      PLAYWRIGHT_HTML_OPEN: never
    volumes:
      - ..:/app
      - playwright-node-modules:/app/test/node_modules
    command: sh -c "npm install && npx playwright test --project=chromium"

volumes:
  playwright-node-modules:
