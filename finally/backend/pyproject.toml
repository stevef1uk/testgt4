[project]
name = "stockpilot-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
"fastapi==0.115.6",
"uvicorn[standard]==0.34.0",
"sqlalchemy==2.0.36",
"pydantic==2.10.4",
"pydantic-settings==2.7.0",
"python-dotenv==1.0.1",
"sse-starlette==2.1.3",
"httpx==0.28.1",
"yfinance==0.2.51",
"pytest==8.3.4",
"pytest-asyncio==0.25.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "db*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
