# Optional convenience wrapper for running the StockPilot app in a container.
# The primary runtime per SPEC is scripts/start_mac.sh on the host.
services:
  app:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8010
    ports:
      - "8010:8010"
    volumes:
      - .:/app
      - finally-data:/app/db
    command: >
      /bin/sh -c "pip install --no-cache-dir -e ./backend && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8010"

volumes:
  finally-data: